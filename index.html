<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Селлер: от ларька до бренда</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ac:#7c3aed;--ac2:#16a34a;--bd:#e5e1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1f2127;--tx:#eceef2;--mut:#9aa1ad;--bd:#2e313a}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1f2127;--tx:#eceef2;--mut:#9aa1ad;--bd:#2e313a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:12px}
.top{text-align:center}.cash{font-size:32px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 10px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
.big{width:100%;padding:18px;font-size:18px;font-weight:700;background:var(--ac);color:#fff;border-color:var(--ac);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.big:active{transform:scale(.98)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card .i{flex:1}.card b{display:block}
.buff{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;justify-content:center}
.tag{background:var(--ac2);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;border-radius:10px;padding:10px 14px;max-width:90%;z-index:9;display:none;text-align:center}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--ac2)}
h3{margin:14px 0 4px}
</style>
</head>
<body>
<div class="w">
 <div class="top"><div class="mut">Ваш оборот</div><div class="cash" id="cash">0 ₽</div>
 <div class="mut"><span id="ips"></span> · репутация: <span id="rep">0</span></div></div>
 <div class="buff" id="buffs"></div>
 <button class="big" id="tap">📦 Отправить заказ <span id="cv"></span></button>
 <div class="tabs"><button data-t="biz" class="on">Бизнес</button><button data-t="ref">Друзья</button><button data-t="shop">Бонусы</button></div>
 <div id="biz"></div>
 <div id="ref" hidden></div>
 <div id="shop" hidden></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var BIZ=[
["Закупка партии",15,.1],["Карточки товаров",100,1],["Менеджер по карточкам",1100,8],["Реклама в выдаче",12000,47],
["Свой склад",130000,260],["Пункт выдачи",1.4e6,1400],["Собственный бренд",2e7,7800],["Выход на другие площадки",3.3e8,44000]];
var TIERS=[[3,"Склад-партнёр: +10% к доходу"],[10,"Скин бренда: +10% к доходу"],[25,"Статус «Топ-реферер»: +10% к доходу"]];
var S={cash:0,run:0,lv:BIZ.map(function(){return 0}),rep:0,friends:0,ref:Math.random().toString(36).slice(2,8),ts:Date.now(),adUntil:0,evUntil:0,evMult:1,evName:""};
try{var raw=localStorage.getItem("seller1");if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function fmt(n){var u=["","К","М","млрд","трлн","квдрл"],i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (i?n.toFixed(n<10?2:1):n<10?n.toFixed(1):Math.floor(n))+(u[i]?" "+u[i]:"")}
function cost(i){return Math.ceil(BIZ[i][1]*Math.pow(1.15,S.lv[i]))}
function base(){var s=0;BIZ.forEach(function(b,i){s+=b[2]*S.lv[i]});return s}
function tiers(){return TIERS.filter(function(t){return S.friends>=t[0]}).length}
function mult(){var now=Date.now();return(1+.1*S.rep)*(1+.05*S.friends+.1*tiers())*(now<S.adUntil?2:1)*(now<S.evUntil?S.evMult:1)}
function ips(){return base()*mult()}
function clickV(){return(1+base()*.05)*mult()}
function $(id){return document.getElementById(id)}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display="none"},3200)}
function add(n){S.cash+=n;S.run+=n}
function save(){S.ts=Date.now();try{localStorage.setItem("seller1",JSON.stringify(S))}catch(e){}}

// Рекламная заглушка: сюда подключается SDK (Telegram/VK/Яндекс Игры)
function showRewardedAd(cb){toast("Реклама (заглушка)… 3 сек");setTimeout(cb,3000)}
// Покупка за Stars: заглушка под Telegram Stars / VK Pay
function buyStub(name,cb){toast("Оплата «"+name+"» (заглушка)");setTimeout(cb,800)}

// Бизнес
var bz=$("biz");
BIZ.forEach(function(b,i){var d=document.createElement("div");d.className="card";
d.innerHTML='<div class="i"><b>'+b[0]+' <span class="mut" id="l'+i+'"></span></b><span class="mut" id="p'+i+'"></span></div><button id="b'+i+'"></button>';
bz.appendChild(d);$("b"+i).onclick=function(){var c=cost(i);if(S.cash>=c){S.cash-=c;S.lv[i]++;draw()}}});
var pr=document.createElement("div");pr.className="card";
pr.innerHTML='<div class="i"><b>🏷 Продать бренд</b><span class="mut" id="pt"></span></div><button id="pb">Продать</button>';bz.appendChild(pr);
function gain(){return Math.floor(Math.sqrt(S.run/1e5))}
$("pb").onclick=function(){var g=gain();if(g<1)return;if(!confirm("Продать бренд и получить +"+g+" репутации? Прогресс бизнеса сбросится."))return;
S.rep+=g;S.cash=0;S.run=0;S.lv=BIZ.map(function(){return 0});draw();toast("Бренд продан! +"+g+" репутации (+"+g*10+"% к доходу)")};
$("tap").onclick=function(){add(clickV())};

// Друзья
var tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
var CFG={api:"https://YOUR_DOMAIN",bot:"RabotaDlyaStudentov1981_Bot",app:"game"};
function uid(){return tg&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:S.ref}
function api(p,b){b=b||{};b.initData=tg.initData;return fetch(CFG.api+"/api/"+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function link(){return"https://t.me/"+CFG.bot+"/"+CFG.app+"?startapp=ref_"+uid()}
function drawRef(){var h='<h3>Приглашайте друзей</h3><div class="card"><div class="i"><b>Ваша ссылка</b><span class="mut" style="word-break:break-all">'+link()+'</span></div><button id="cp">Копировать</button></div>';
h+='<div class="mut">Друг получает стартовый бонус, вы — +5% к доходу за каждого активного друга. Награда выдаётся, когда друг дошёл до 2–3 уровня бизнеса.</div>';
h+='<h3>Приглашено: '+S.friends+'</h3>';
TIERS.forEach(function(t){var ok=S.friends>=t[0];h+='<div class="card"><div class="i"><b>'+(ok?"✅ ":"🔒 ")+t[0]+' друзей</b><span class="mut">'+t[1]+'</span><div class="bar"><i style="width:'+Math.min(100,S.friends/t[0]*100)+'%"></i></div></div></div>'});
if(!tg)h+='<button id="sim" style="width:100%;margin-top:8px">Демо: имитировать приход друга</button>';
h+='<div class="mut" style="margin-top:8px">В боевой версии приглашения считает сервер (бот): пара «кто пригласил → кто пришёл → статус награды», с лимитами против накруток.</div>';
$("ref").innerHTML=h;
$("cp").onclick=function(){try{navigator.clipboard.writeText(link()).then(function(){toast("Ссылка скопирована")},function(){toast("Скопируйте ссылку вручную")})}catch(e){toast("Скопируйте ссылку вручную")}};
if($("sim"))$("sim").onclick=function(){S.friends++;add(ips()*600+100);drawRef();toast("Друг пришёл! Бонус зачислен")}}

// Бонусы
function drawShop(){$("shop").innerHTML=
'<div class="card"><div class="i"><b>📺 Реклама: доход ×2 на 2 минуты</b><span class="mut">Rewarded-реклама, игрок выбирает сам</span></div><button id="ad">Смотреть</button></div>'+
'<div class="card"><div class="i"><b>⭐ Набор «Час работы»</b><span class="mut">Доход за 1 час сразу (покупка за Stars)</span></div><button id="st">⭐ 50</button></div>'+
'<div class="card"><div class="i"><b>📅 Ежедневная награда</b><span class="mut" id="dl"></span></div><button id="dy">Забрать</button></div>';
$("ad").onclick=function(){showRewardedAd(function(){S.adUntil=Math.max(Date.now(),S.adUntil)+120000;toast("Доход ×2 на 2 минуты!")})};
$("st").onclick=function(){var ok=function(){add(ips()*3600+100);toast("Набор получен")};
if(!tg)return buyStub("Час работы",ok);
api("invoice",{item:"hour"}).then(function(r){tg.openInvoice(r.url,function(st){if(st==="paid")ok()})}).catch(function(){toast("Оплата недоступна")})};
$("dy").onclick=function(){var d=new Date().toDateString();if(S.day===d)return;S.day=d;add(ips()*900+200);toast("Награда за заход получена");drawShop()};
$("dl").textContent=S.day===new Date().toDateString()?"Уже получена, приходите завтра":"Доход за 15 минут"}

document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
document.querySelectorAll(".tabs button").forEach(function(x){x.className=""});b.className="on";
["biz","ref","shop"].forEach(function(t){$(t).hidden=t!==b.dataset.t});
if(b.dataset.t==="ref")drawRef();if(b.dataset.t==="shop")drawShop()}});

function draw(){
$("cash").textContent=fmt(S.cash)+" ₽";$("ips").textContent="+"+fmt(ips())+" ₽/сек";$("rep").textContent=S.rep;$("cv").textContent="(+"+fmt(clickV())+")";
BIZ.forEach(function(b,i){var c=cost(i);$("l"+i).textContent="ур. "+S.lv[i];$("p"+i).textContent="+"+fmt(b[2]*mult())+" ₽/сек за уровень";
var e=$("b"+i);e.textContent=fmt(c)+" ₽";e.disabled=S.cash<c});
var g=gain();$("pt").textContent=g>=1?"Получите +"+g+" репутации (+"+g*10+"% к доходу навсегда)":"Нужно заработать ещё: сейчас репутации не хватает";$("pb").disabled=g<1;
var now=Date.now(),h="";if(now<S.adUntil)h+='<span class="tag">📺 ×2 · '+Math.ceil((S.adUntil-now)/1000)+' с</span>';
if(now<S.evUntil)h+='<span class="tag" style="background:'+(S.evMult<1?"#dc2626":"#16a34a")+'">'+S.evName+' · '+Math.ceil((S.evUntil-now)/1000)+' с</span>';
$("buffs").innerHTML=h}

// События (календарь ивентов в миниатюре)
var EV=[["🛍 Чёрная пятница ×3",3,30],["🔥 11.11 ×2",2,40],["⚠️ Волна возвратов ×0.5",.5,25]];
setInterval(function(){if(Date.now()<S.evUntil||Math.random()>.35)return;var e=EV[Math.floor(Math.random()*EV.length)];
S.evName=e[0];S.evMult=e[1];S.evUntil=Date.now()+e[2]*1000;toast("Событие: "+e[0])},20000);

// Оффлайн-доход (до 2 часов, 50%)
var away=Math.min((Date.now()-S.ts)/1000,7200);
if(away>60&&base()>0){var g0=base()*(1+.1*S.rep)*(1+.05*S.friends+.1*tiers())*away*.5;add(g0);toast("Пока вас не было: +"+fmt(g0)+" ₽")}

var last=Date.now(),sv=0;
setInterval(function(){var n=Date.now(),dt=(n-last)/1000;last=n;add(ips()*dt);draw();sv+=dt;if(sv>5){sv=0;save()}},200);
window.addEventListener("beforeunload",save);
draw();
if(tg){tg.ready();tg.expand();
function lvl(){return S.lv.reduce(function(a,b){return a+b},0)}
function pull(r){if(r&&typeof r.friends==="number"){S.friends=Math.max(S.friends,r.friends)}}
api("join").then(pull).catch(function(){});
setInterval(function(){api("sync",{level:lvl()}).then(pull).catch(function(){})},30000)}
})();
</script>
</body>
</html>
